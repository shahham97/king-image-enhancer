<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D785" />
      <stop offset="50%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#9A7B3E" />
    </linearGradient>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14131D" />
      <stop offset="100%" stop-color="#06050A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Obsidian Background -->
  <circle cx="32" cy="32" r="30" fill="url(#obsidianBg)" stroke="url(#goldGradient)" stroke-width="2" />
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(201, 169, 110, 0.35)" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Royal Kingshyer Crown & Flacon Crest -->
  <g filter="url(#goldGlow)" fill="url(#goldGradient)">
    <!-- Royal Crown Top -->
    <path d="M22 25 L24.5 32 L32 27 L39.5 32 L42 25 L40 37 L24 37 Z" />
    <!-- Crown Jewels / Orbs -->
    <circle cx="22" cy="24" r="1.6" />
    <circle cx="32" cy="25" r="2" />
    <circle cx="42" cy="24" r="1.6" />
    <circle cx="27" cy="27" r="1.2" />
    <circle cx="37" cy="27" r="1.2" />
    
    <!-- Flacon Pedestal / Base -->
    <rect x="25" y="39" width="14" height="2" rx="1" />
    <polygon points="27,42 37,42 35,46 29,46" opacity="0.85" />
  </g>
</svg>
